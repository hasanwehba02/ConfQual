name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: confqual_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d confqual_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:test@localhost:5432/confqual_test
      DB_SSL: "false"
      CONFQUAL_RUN_DESTRUCTIVE_DB_TESTS: "true"
      CONFQUAL_DIRECT_ID_TEST_DB: "true"
      CONFQUAL_SUPPORT_TEST_DB: "true"

    defaults:
      run:
        working-directory: backend

    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: backend/package-lock.json
    
    - name: Install dependencies
      run: npm ci
      
    - name: Run Linter
      run: npm run lint

    - name: Initialize test database
      run: |
        psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE ROLE anon NOLOGIN; CREATE ROLE authenticated NOLOGIN;"
        psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f ../database/confqual_schema.sql -f ../database/migrations/001_workspaces_up.sql -f ../database/migrations/002_support_access_up.sql -f ../database/migrations/003_preserve_support_audit_up.sql
        psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO anon, authenticated; GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO anon, authenticated;"
        psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f ../database/migrations/004_revoke_data_api_access_up.sql -f tests/analytics-fixture.sql
        psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "DO \$\$ BEGIN IF has_table_privilege('anon', 'workspace', 'SELECT') OR has_table_privilege('authenticated', 'workspace', 'SELECT') OR has_function_privilege('anon', 'public.confqual_current_workspace_id()', 'EXECUTE') OR has_function_privilege('authenticated', 'public.confqual_current_workspace_id()', 'EXECUTE') THEN RAISE EXCEPTION 'Supabase Data API roles can access workspace authorization'; END IF; END \$\$;"
      
    - name: Run Tests
      run: npm test
