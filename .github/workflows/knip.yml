name: Knip

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  knip:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run knip
        continue-on-error: true
