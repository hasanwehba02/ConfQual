<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <title>Reset password | ConfQual</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="style.css">
    <script src="/vendor/supabase.js"></script>
</head>
<body class="auth-page">
    <main class="auth-card">
        <div class="brand auth-brand"><span class="auth-mark"></span>ConfQual</div>
        <h1>Reset password</h1>
        <p class="text-muted">Enter your account email address to request a reset link.</p>
        <form id="recovery-request-form" class="auth-form">
            <label>Email
                <input name="email" type="email" autocomplete="email" required>
            </label>
            <button class="btn btn-primary w-full" type="submit">Send reset link</button>
        </form>
        <p id="recovery-request-message" class="mt-4" role="status" aria-live="polite"></p>
        <p class="mt-4"><a href="/login.html">Back to sign in</a></p>
    </main>
    <script type="module" src="js/forgotPassword.js"></script>
</body>
</html>
