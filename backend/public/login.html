<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sign in to the private ConfQual conference analytics workspace.">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <title>Sign in | ConfQual</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="style.css">
    <script src="/vendor/supabase.js"></script>
</head>
<body class="auth-page">
    <main class="auth-card">
        <div class="brand auth-brand"><span class="auth-mark"></span>ConfQual</div>
        <h1>Sign in</h1>
        <p class="text-muted">Use your invited conference account.</p>
        <form id="login-form" class="auth-form">
            <label>Email
                <input type="email" name="email" autocomplete="email" required>
            </label>
            <label>Password
                <input type="password" name="password" autocomplete="current-password" required>
            </label>
            <p id="login-message" class="auth-error" role="alert"></p>
            <button type="submit" class="btn btn-primary w-full">Sign in</button>
        </form>
        <p class="mt-4"><a href="/forgot-password.html">Forgot your password?</a></p>
    </main>
    <script type="module" src="js/login.js"></script>
</body>
</html>
