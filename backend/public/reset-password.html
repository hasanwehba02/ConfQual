<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <title>Choose a password | ConfQual</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="style.css">
    <script src="/vendor/supabase.js"></script>
</head>
<body class="auth-page">
    <main class="auth-card">
        <div class="brand auth-brand"><span class="auth-mark"></span>ConfQual</div>
        <h1>Choose a new password</h1>
        <p id="recovery-description" class="text-muted">Checking your reset link…</p>
        <form id="recovery-mfa-form" class="auth-form" hidden>
            <label>Authenticator code
                <input name="code" type="text" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required>
            </label>
            <button class="btn btn-primary w-full" type="submit">Verify authenticator</button>
        </form>
        <form id="recovery-form" class="auth-form" hidden>
            <label>New password
                <input name="password" type="password" autocomplete="new-password" minlength="12" required>
            </label>
            <label>Confirm new password
                <input name="confirm" type="password" autocomplete="new-password" minlength="12" required>
            </label>
            <button class="btn btn-primary w-full" type="submit">Update password</button>
        </form>
        <p id="recovery-message" class="auth-error mt-4" role="alert"></p>
        <button id="recovery-signout-retry" class="btn btn-outline mt-4" type="button" hidden>Try signing out again</button>
        <p id="recovery-lost-factor" class="mt-4" hidden>Lost access to your authenticator? Contact the workspace operator. A password reset cannot remove MFA.</p>
        <p class="mt-4"><a href="/login.html">Back to sign in</a></p>
    </main>
    <script type="module" src="js/resetPassword.js"></script>
</body>
</html>
